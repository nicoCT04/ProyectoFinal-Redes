# /etc/nginx/sites-available/farmaruta  (vm-web-dmz, 10.10.0.148)
# Web publica de Ventas de FarmaRuta, servida desde la DMZ.
# Esta es la version HTTP que se escribe a mano. Despues certbot la modifica
# para agregar el bloque 443 (HTTPS) y la redireccion 301: ver farmaruta-https.conf
server {

    # Virtual host: nginx responde con este sitio cuando el navegador pide este dominio
    server_name farmaruta-ventas.mexicocentral.cloudapp.azure.com;

    root /var/www/farmaruta;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/farmaruta-ventas.mexicocentral.cloudapp.azure.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/farmaruta-ventas.mexicocentral.cloudapp.azure.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = farmaruta-ventas.mexicocentral.cloudapp.azure.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name farmaruta-ventas.mexicocentral.cloudapp.azure.com;
    return 404; # managed by Certbot


}