<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FarmaRuta · Encontrá tu medicina más barata</title>
<style>
  :root { --verde:#0f7b5f; --tinta:#1d2b27; --gris:#5f6f6a; --borde:#d6e2dd; --fondo:#f7faf9; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--tinta); background:var(--fondo); }
  .contenedor { width:100%; max-width:960px; margin:0 auto; padding:0 20px; }
  header { background:#fff; border-bottom:1px solid var(--borde); }
  .barra { display:flex; align-items:center; gap:10px; padding-top:14px; padding-bottom:14px; }
  .marca { font-weight:800; font-size:1.4rem; color:var(--verde); }
  .hero { padding-top:48px; padding-bottom:24px; }
  h1 { font-size:clamp(1.8rem, 4vw, 2.6rem); margin:0 0 8px; }
  .hero p { color:var(--gris); margin:0 0 24px; font-size:1.1rem; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1; min-width:220px; padding:14px 16px; font-size:1rem; border:2px solid var(--borde); border-radius:10px; }
  input:focus { outline:none; border-color:var(--verde); }
  button { padding:14px 22px; font-size:1rem; font-weight:600; color:#fff; background:var(--verde); border:0; border-radius:10px; cursor:pointer; }
  main { flex:1; padding-bottom:48px; }
  .tarjeta { background:#fff; border:1px solid var(--borde); border-radius:12px; padding:18px 20px; margin-top:14px; }
  .tarjeta h2 { font-size:1.15rem; margin:0 0 2px; }
  .tarjeta small { color:var(--gris); }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  td { padding:8px 0; border-top:1px solid var(--borde); }
  td:last-child { text-align:right; font-weight:600; white-space:nowrap; }
  tr.barata td { color:var(--verde); font-weight:700; }
  .etiqueta { font-size:.75rem; background:var(--verde); color:#fff; border-radius:999px; padding:2px 8px; margin-left:6px; }
  .vacio { color:var(--gris); margin-top:18px; }
  footer { text-align:center; color:var(--gris); font-size:.85rem; padding:24px; border-top:1px solid var(--borde); background:#fff; }
</style>
</head>
<body>
<header>
  <div class="contenedor barra">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <path d="M17 2C10.4 2 5 7.2 5 13.6 5 22.4 17 32 17 32s12-9.6 12-18.4C29 7.2 23.6 2 17 2z" fill="#0f7b5f"/>
      <path d="M15 7h4v4.5h4.5v4H19V20h-4v-4.5h-4.5v-4H15z" fill="#fff"/>
    </svg>
    <span class="marca">FarmaRuta</span>
  </div>
</header>

<section class="contenedor hero">
  <h1>Encontrá tu medicina más barata</h1>
  <p>Compará precios entre farmacias de tu zona antes de salir de casa.</p>
  <form id="buscar" role="search">
    <input id="q" type="search" placeholder="Ej.: acetaminofén, ibuprofeno, loratadina" aria-label="Nombre del medicamento" autocomplete="off">
    <button type="submit">Buscar</button>
  </form>
</section>

<main id="resultados" class="contenedor" aria-live="polite"></main>

<footer>FarmaRuta · Proyecto Final de Redes (UVG) · Los precios son de demostración, no son reales.</footer>

<script>
  // Datos de demostracion: precios en quetzales por farmacia (ficticias).
  const MEDICINAS = [
    { nombre: "Acetaminofén 500 mg", detalle: "Caja de 100 tabletas", precios: { "Farmacia La Esquina": 42.50, "Botica del Centro": 38.00, "FarmaSalud Zona 10": 45.90 } },
    { nombre: "Ibuprofeno 400 mg", detalle: "Caja de 50 tabletas", precios: { "Farmacia La Esquina": 55.00, "Botica del Centro": 61.25, "FarmaSalud Zona 10": 49.75 } },
    { nombre: "Loratadina 10 mg", detalle: "Caja de 10 tabletas", precios: { "Farmacia La Esquina": 24.00, "Botica del Centro": 19.50, "FarmaSalud Zona 10": 27.30 } },
    { nombre: "Omeprazol 20 mg", detalle: "Caja de 30 cápsulas", precios: { "Farmacia La Esquina": 68.00, "Botica del Centro": 72.40, "FarmaSalud Zona 10": 59.90 } },
    { nombre: "Amoxicilina 500 mg", detalle: "Caja de 21 cápsulas", precios: { "Farmacia La Esquina": 89.00, "Botica del Centro": 84.50, "FarmaSalud Zona 10": 92.00 } },
    { nombre: "Suero oral", detalle: "Sobre de 27.9 g", precios: { "Farmacia La Esquina": 6.50, "Botica del Centro": 5.75, "FarmaSalud Zona 10": 7.25 } }
  ];

  // Quita tildes y mayusculas para que "acetaminofen" encuentre "Acetaminofén".
  const normalizar = (texto) => texto.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

  function tarjeta(med) {
    const div = document.createElement("div");
    div.className = "tarjeta";
    const titulo = document.createElement("h2");
    titulo.textContent = med.nombre;
    const detalle = document.createElement("small");
    detalle.textContent = med.detalle;
    const tabla = document.createElement("table");
    const ordenados = Object.entries(med.precios).sort((a, b) => a[1] - b[1]);
    ordenados.forEach(([farmacia, precio], i) => {
      const fila = tabla.insertRow();
      if (i === 0) fila.className = "barata";
      const celdaFarmacia = fila.insertCell();
      celdaFarmacia.textContent = farmacia;
      if (i === 0) {
        const etiqueta = document.createElement("span");
        etiqueta.className = "etiqueta";
        etiqueta.textContent = "más barata";
        celdaFarmacia.appendChild(etiqueta);
      }
      fila.insertCell().textContent = "Q " + precio.toFixed(2);
    });
    div.append(titulo, detalle, tabla);
    return div;
  }

  function mostrar(consulta) {
    const resultados = document.getElementById("resultados");
    resultados.replaceChildren();
    const q = normalizar(consulta);
    const encontradas = MEDICINAS.filter((m) => normalizar(m.nombre).includes(q));
    if (encontradas.length === 0) {
      const p = document.createElement("p");
      p.className = "vacio";
      p.textContent = "No encontramos \"" + consulta + "\". Probá con otro nombre.";
      resultados.appendChild(p);
      return;
    }
    encontradas.forEach((m) => resultados.appendChild(tarjeta(m)));
  }

  document.getElementById("buscar").addEventListener("submit", (e) => {
    e.preventDefault();
    mostrar(document.getElementById("q").value);
  });

  mostrar(""); // al abrir la pagina se ven todas
</script>
</body>
</html>
