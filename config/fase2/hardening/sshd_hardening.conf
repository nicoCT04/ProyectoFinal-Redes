# /etc/ssh/sshd_config.d/10-farmaruta-hardening.conf
# FarmaRuta - Fase 2: endurecimiento de SSH en todas las VMs

# Nadie entra como root; se entra como azureuser y se usa sudo
PermitRootLogin no

# Solo llave publica (farmaruta-key). Sin contrasenas no hay fuerza bruta posible
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# Unico usuario autorizado
AllowUsers azureuser

# Menos intentos por conexion y menos tiempo para autenticarse
MaxAuthTries 3
LoginGraceTime 30

# Son servidores sin entorno grafico ni necesidad de reenviar el agente
X11Forwarding no
AllowAgentForwarding no

# Cierra sesiones colgadas despues de ~10 minutos sin respuesta
ClientAliveInterval 300
ClientAliveCountMax 2
