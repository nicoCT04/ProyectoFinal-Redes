# =====================================================================
# FarmaRuta - Fase 2: cliente DNS en las VMs internas (Ubuntu)
# /etc/systemd/resolved.conf.d/farmaruta.conf
#
# systemd-resolved trata los nombres .local como Multicast DNS (mDNS) y no
# los manda al servidor DNS aunque la VNet anuncie 10.10.0.132 por DHCP:
# responde "No appropriate name servers". Con un dominio de enrutamiento
# (~) se le indica que farmaruta.local y la zona inversa se pregunten a BIND.
# Se aplica en vm-ventas-01, vm-ti-01 y vm-intranet.
# =====================================================================
[Resolve]
DNS=10.10.0.132
Domains=~farmaruta.local ~0.10.10.in-addr.arpa
