# =====================================================================
# FarmaRuta - Intranet de RRHH (vm-intranet 10.10.0.133)
# /etc/nginx/sites-available/rrhh
# Se activa con: ln -s /etc/nginx/sites-available/rrhh /etc/nginx/sites-enabled/rrhh
# =====================================================================
server {
    # Escucha SOLO en la IP privada. Aunque la VM tuviera otra interfaz,
    # nginx no atenderia nada por ella.
    listen 10.10.0.133:80 default_server;

    # Virtual host: nginx elige este sitio segun el encabezado Host.
    # intranet.farmaruta.local es un CNAME de rrhh en el DNS de Daniela.
    server_name rrhh.farmaruta.local intranet.farmaruta.local;

    # Carpeta donde esta la pagina estatica
    root /var/www/rrhh;
    index index.html;

    # No mostrar la version de nginx en errores ni encabezados (hardening)
    server_tokens off;

    # Tercera capa de control (ademas del NSG y de no tener IP publica):
    # solo las redes internas autorizadas. Visitas (10.10.0.0/26) y la DMZ
    # (10.10.0.144/28) reciben 403 aunque alguien abriera el NSG por error.
    allow 10.10.0.64/27;    # Ventas
    allow 10.10.0.96/27;    # TI
    allow 10.10.0.128/28;   # Data Center
    allow 127.0.0.1;        # la propia VM
    deny  all;

    location / {
        # Si el archivo no existe, 404 (no lista directorios)
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/rrhh_access.log;
    error_log  /var/log/nginx/rrhh_error.log;
}
